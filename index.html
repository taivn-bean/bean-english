<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3faf2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14231a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bean" />

    <meta name="description" content="Mẫu câu tiếng Anh cho ba mẹ nói cùng bé" />
    <title>Bean English</title>
    <!-- start fetching the topic list in parallel with the JS (same request content.ts makes) -->
    <link rel="preload" href="/content/index.json" as="fetch" crossorigin="anonymous" />
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f3faf2; transition: opacity .2s }
      #splash.out { opacity: 0; pointer-events: none }
      #splash svg { animation: splash-bob 1.2s ease-in-out infinite alternate }
      @keyframes splash-bob { to { transform: translateY(-6px) } }
      @media (prefers-color-scheme: dark) { #splash { background: #13211a } }
      @media (prefers-reduced-motion: reduce) { #splash svg { animation: none } }
    </style>
  </head>
